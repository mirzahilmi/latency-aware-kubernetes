---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellopod-static
  namespace: riset
spec:
  replicas: 16
  selector:
    matchLabels:
      app: hellopod-static
  template:
    metadata:
      labels:
        app: hellopod-static
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/worker
                    operator: Exists

      topologySpreadConstraints:
        # Hard constraint: with ScheduleAnyway the spread is only a scoring hint,
        # and a rolling update leaves a lasting skew (4/2/5/5 was observed). Node
        # share of served requests then tracks pod count instead of node
        # capability, which makes the load balancer unmeasurable.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: hellopod-static
          # Count only pods of the ReplicaSet being rolled out, so surge pods are
          # not blocked by the outgoing generation still occupying the nodes.
          matchLabelKeys:
            - pod-template-hash

      containers:
        - name: hellopod-static-app
          image: ghcr.io/mirzahilmi/hellopod-static:1.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: PORT
              value: "8080"
            - name: TARGET_CPU_COST_IN_MILLISECONDS
              value: "2"

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: POD_MEM_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          # per-container security context
          # lock down privileges inside the container
          securityContext:
            allowPrivilegeEscalation: false # prevent sudo, etc.
            privileged: false # prevent acting like host root

      terminationGracePeriodSeconds: 120

      # per-pod security context
      # enable seccomp and force non-root user
      securityContext:
        seccompProfile:
          type: RuntimeDefault # enable seccomp and the runtimes default profile

        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: hellopod-static-np-svc
  namespace: riset
spec:
  type: NodePort
  selector:
    app: hellopod-static
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8080
      nodePort: 30000
