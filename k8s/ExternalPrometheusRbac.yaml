---
# ServiceAccount + RBAC for an out-of-cluster Prometheus instance.
# Prometheus discovers pods via the API server and scrapes them through the
# apiserver proxy (/api/v1/namespaces/.../pods/<pod>:<port>/proxy/metrics),
# since pod IPs are not routable from outside the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-prometheus
  namespace: riset
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints]
    verbs: [get, list, watch] # service discovery
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get] # scrape /metrics via the apiserver proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-prometheus
subjects:
  - kind: ServiceAccount
    name: external-prometheus
    namespace: riset
---
# Long-lived token for the ServiceAccount. Extract onto the Prometheus host:
#   kubectl -n riset get secret external-prometheus-token \
#     -o jsonpath='{.data.token}'  | base64 -d > /etc/prometheus/k3s/token
#   kubectl -n riset get secret external-prometheus-token \
#     -o jsonpath='{.data.ca\.crt}' | base64 -d > /etc/prometheus/k3s/ca.crt
apiVersion: v1
kind: Secret
metadata:
  name: external-prometheus-token
  namespace: riset
  annotations:
    kubernetes.io/service-account.name: external-prometheus
type: kubernetes.io/service-account-token
